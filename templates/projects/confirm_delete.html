{% extends "base.html" %}
{% block title %}Delete {{ object_type }} | Flowboard{% endblock %}
{% block content %}<div class="form-card"><span class="eyebrow">Permanent action</span><h1>Delete {{ object_type }}?</h1><p>This will permanently remove <b>{{ object }}</b> and all of its related data.</p><form method="post">{% csrf_token %}<button class="button danger" type="submit">Yes, delete {{ object_type }}</button> <a class="button secondary" href="{% url 'project_detail' object.pk %}">Cancel</a></form></div>{% endblock %}
